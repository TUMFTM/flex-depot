# Pipelines run only on demand:
#   - push with "[run]" anywhere in the commit message, or
#   - manually via Build > Pipelines > "New pipeline" (variables can be
#     overridden there, e.g. BATCH_DIR).
workflow:
  # Simulation pipelines are compute runs, not tests: a newer commit must not
  # cancel queued/running runs of older commits.
  auto_cancel:
    on_new_commit: none
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_MESSAGE =~ /\[run\]/'
    - when: never

stages:
  - build
  - simulate

variables:
  # PARAM MODIFICATION HERE
  BATCH_DIR: "batches/idhorizon_sensitivity"  # batch directory passed to run-batch

# Builds the environment image (Python deps + gurobipy) and pushes it to the
# project container registry. Layers are cached via the :latest tag, so this
# is fast as long as the Dockerfile is unchanged.
build_image:
  stage: build
  image: docker:28.0.0
  services:
    - name: docker:28.0.0-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker pull "$CI_REGISTRY_IMAGE:latest" || true
    - docker build
        --cache-from "$CI_REGISTRY_IMAGE:latest"
        --build-arg BUILDKIT_INLINE_CACHE=1
        -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
        -t "$CI_REGISTRY_IMAGE:latest" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
    - docker push "$CI_REGISTRY_IMAGE:latest"

# Runs the batch inside the environment image on the checked-out repo.
# Gurobi WLS license: the CI/CD variable GUROBI_LICENSE (Settings > CI/CD >
# Variables) must contain the content of the WLS license file, i.e. the lines
# WLSACCESSID=..., WLSSECRET=..., LICENSEID=... (no GRB_ prefix).
# Works with variable type "Variable" (content) as well as "File" (path).
run_batch:
  stage: simulate
  image: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHA"
  needs:
    - build_image
  timeout: 72h
  script:
    - |
      if [ -f "$GUROBI_LICENSE" ]; then
        export GRB_LICENSE_FILE="$GUROBI_LICENSE"
      else
        printf '%s\n' "$GUROBI_LICENSE" > /tmp/gurobi.lic
        export GRB_LICENSE_FILE=/tmp/gurobi.lic
      fi
    - pip install --no-deps -e .
    - python -c "import pyomo.environ as pyo, sys; ok = pyo.SolverFactory('gurobi').available(False); print('gurobi available:', ok); sys.exit(0 if ok else 1)"
    - python -m flex_dep_opt run-batch "$BATCH_DIR"  # --jobs defaults to all CPU cores
  artifacts:
    when: always
    expire_in: 2 weeks
    paths:
      - results/
