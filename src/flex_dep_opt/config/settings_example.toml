[simulation]
start = "2025-10-01 00:00"
end = "2025-10-08 00:00"
timestep_hours = 0.25
name = "illustrative_example"
solver = "cbc"

[optimization.markets.dayahead]
enabled = true
source = "data/prices/prices_DA_example.csv"
fee_eur_per_kwh = 0.005                      # clearing fee + exchange fee + broker fee + ...

[optimization.markets.intraday]
enabled = true
source = "data/prices/prices_IDC_example.csv"
fee_eur_per_kwh = 0.008                       # clearing fee + exchange fee + broker fee + ...

[optimization.trading]
mode = "realistic"

[optimization.trading.dayahead]
gate_closure_hour = "12:00"
closes_previous_day = true

[optimization.trading.intraday]
offset_minutes_before_delivery = 0 # trading until delivery time

[optimization.trading.fcr]
enabled = true
prices_source = "data/prices/RESULT_OVERVIEW_CAPACITY_MARKET_FCR_2025-01-01_2025-12-31.xlsx"
frequency_source = "data/prices/Frequenz_20250101_20251231_15min.csv"
acceptance_rate = 1.0
acceptance_seed = 1
breakeven_analysis = true
breakeven_include_zero_bid = true
gate_closure_hour = "08:00"
gate_closure_closes_previous_day = true
gate_closure_timezone = "Europe/Berlin"
product_hours = 4.0
bid_block_mw = 1.0
energy_reserve_minutes = 15.0
reserve_penalty_eur_per_kwh = 10.0
balance_penalty_eur_per_kwh = 0.0001
frequency_nominal_hz = 50.0
deadband_hz = 0.010
full_activation_hz = 0.200

[optimization.imbalance]
enabled = true
source_pos = "data/prices/prices_reBAPpos_example.csv"
source_neg = "data/prices/prices_reBAPneg_example.csv"
imbalance_volume_penalty_eur_per_kwh = 1000.0

[optimization]
virtual_arbitrage = false

[optimization.mpc]
da_horizon_hours = 48
id_horizon_hours = 1
fcr_price_horizon_hours = 48
fcr_frequency_horizon_minutes = 0
terminal_condition = true
terminal_weight_eur_per_kwh = 50.0

[optimization.flexibility]
bounds_file = "data/flexibility/vb_bounds_example_new.csv"

[optimization.flexibility.cycle_regularization]
enabled = true
cost_eur_per_kwh_throughput = 0.02

[optimization.depot]
eta_grid2depot = 1.0
eta_depot2grid = 1.0
grid_connection_limit = 10000

[postprocessing.reference_driving_energy_costs]
# Static-price reference scenario for driving energy. Requires the bounds_file
# above to contain the energy_column (vb_bounds_example_new.csv does).
enabled = true
static_price_eur_per_kwh = 0.1142
energy_column = "Ref_driving_energy_kWh"
