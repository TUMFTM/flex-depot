simulation:
  start: "2025-10-01 00:00"
  end: "2025-10-3 23:45"
  timestep_hours: 0.25

optimization:
  mode: joint
  markets:
    dayahead:
      enabled: true
      source: "data/epex_prices_DA.csv"
      tx_fee_eur_per_mwh: 2.0                   # €/MWh
    intraday:
      enabled: true
      source: "data/example_prices_ID.csv"
      tx_fee_eur_per_mwh: 3.0                   # €/MWh
  virtual_arbitrage: false
  degradation:
    enabled: false
    cost_eur_per_mwh_throughput: 20.0
  trading:
    mode: "realistic"   # "none", "realistic"
    dayahead:
      gate_closure_hour: "12:00"                # D-1
      closes_previous_day: true
    intraday:
      offset_minutes_before_delivery: 30       # trading until T-30min
  mpc:
    enabled: true
    horizon_hours: 48

optimize:
  out: "results/dispatch.csv"
  vehicle:
    capacity_kwh: 1000
    soc_min: 0.1
    soc_max: 0.9
    soc0: 0.50
    p_charge_max_kw: 1000
    p_discharge_max_kw: 1000
    eta_charge: 0.95
    eta_discharge: 0.95

plot:
  dispatch: "results/dispatch.csv"
  dispatch_mpc: "results/dispatch_mpc.csv"
  capacity_kwh: 1000
  out: "results/dispatch_plot.html"
  cashflow_out: "results/cashflows_plot.html"
  open: true


