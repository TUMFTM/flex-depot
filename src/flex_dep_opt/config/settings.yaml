simulation:
  start: "2025-10-01 00:00"
  end: "2025-10-01 23:45"
  timestep_hours: 0.25

optimization:
  mode: joint
  markets:
    dayahead:
      enabled: true
      source: "data/epex_prices_DA.csv"
      tx_fee_eur_per_mwh: 2.0                   # €/MWh
    intraday:
      enabled: true
      source: "data/example_prices_ID.csv"
      tx_fee_eur_per_mwh: 3.0                   # €/MWh
  virtual_arbitrage: false
  degradation:
    enabled: true
    cost_eur_per_mwh_throughput: 50.0
  trading:
    mode: "none"   # "none" = heutiges Verhalten. Später z.B. "realistic"

optimize:
  out: "results/dispatch.csv"
  vehicle:
    capacity_kwh: 1000
    soc_min: 0.1
    soc_max: 0.9
    soc0: 0.50
    p_charge_max_kw: 1000
    p_discharge_max_kw: 1000
    eta_charge: 0.95
    eta_discharge: 0.95


plot:
  dispatch: "results/dispatch.csv"
  capacity_kwh: 1000
  out: "results/dispatch_plot.html"
  cashflow_out: "results/cashflows_plot.html"
  open: true


