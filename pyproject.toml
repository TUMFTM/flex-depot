[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-depot"
version = "1.0.0"
description = "Rolling-horizon MPC optimization of depot flexibility with market trading and gate closures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcel Brödel", email = "marcel.broedel@tum.de" }]

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyomo>=6.6",
  "tqdm>=4.67.1",
  "plotly>=5.18",
  "tzdata>=2024.1",
  "openpyxl>=3.1.3",
  "toml>=0.10.2",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]
gurobi = ["gurobipy>=12.0.3"]

[project.scripts]
flex-depot = "flex_dep_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
