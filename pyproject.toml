[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flex-depot"
version = "2.0.0"
description = "Rolling-horizon MPC optimization of depot flexibility with market trading and gate closures."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Marcel Brödel", email = "marcel.broedel@tum.de" }]
keywords = [
  "energy flexibility",
  "electric trucks",
  "depot charging",
  "electricity markets",
  "day-ahead",
  "intraday",
  "FCR",
  "MPC",
  "MILP",
  "Pyomo",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

dependencies = [
  "pandas>=2.0",
  "numpy>=1.24",
  "pyomo>=6.6",
  "highspy>=1.5",
  "tqdm>=4.67.1",
  "plotly>=5.18",
  "tzdata>=2024.1",
  "openpyxl>=3.1.3",
  "toml>=0.10.2",
  "pydantic>=2.13.3",
  "pydantic-settings>=2.14.0",
]

[project.urls]
Repository = "https://github.com/TUMFTM/flex-depot"
Issues = "https://github.com/TUMFTM/flex-depot/issues"

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8.0"]
gurobi = ["gurobipy>=12.0.3"]
# Static figure scripts (examples/illustrative_example/plot_*.py, images/plot_*.py)
paper = ["matplotlib>=3.8"]

[project.scripts]
flex-depot = "flex_dep_opt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# ship the bundled default config so non-editable installs work
"flex_dep_opt.config" = ["settings_quickstart.toml"]

[tool.pytest.ini_options]
markers = ["slow: end-to-end integration tests (deselect with '-m not slow')"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# figure-layout scripts use aligned multi-assignment lines
"images/*" = ["E702"]
