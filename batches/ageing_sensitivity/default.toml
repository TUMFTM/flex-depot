[simulation]
start = "2026-01-01 00:00"
end = "2026-03-25 23:45"
timestep_hours = 0.25
name = "ageing_sensitivity"
solver = "gurobi"
solver_threads = 1

[optimization.markets.dayahead]
enabled = true
source = "data/prices/prices_DA_2026-01-01_2026-05-31.csv"
fee_eur_per_kwh = 0.005

[optimization.markets.intraday]
enabled = true
source = "data/prices/prices_ID_2026-01-01_2026-04-02.csv"
fee_eur_per_kwh = 0.008

[optimization.trading]
mode = "realistic"

[optimization.trading.dayahead]
gate_closure_hour = "12:00"
closes_previous_day = true

[optimization.trading.intraday]
offset_minutes_before_delivery = 0

[optimization.trading.fcr]
enabled = true
prices_source = "data/prices/prices_FCR_2026-01-01_2026-05-31.xlsx"
frequency_source = "data/frequency/frequency_2026-01-01_2026-06-30.csv"
acceptance_rate = 1.0
acceptance_seed = 1
breakeven_analysis = true
breakeven_include_zero_bid = false
gate_closure_hour = "08:00"
gate_closure_closes_previous_day = true
gate_closure_timezone = "Europe/Berlin"
product_hours = 4.0
bid_block_mw = 1.0
energy_reserve_minutes = 15.0
reserve_penalty_eur_per_kwh = 10.0
balance_penalty_eur_per_kwh = 0.0001
frequency_nominal_hz = 50.0
deadband_hz = 0.010
full_activation_hz = 0.200

[optimization.imbalance]
enabled = true
source_pos = "data/prices/prices_reBAPpos_2026-01-01_2026-05-31.csv"
source_neg = "data/prices/prices_reBAPneg_2026-01-01_2026-05-31.csv"
imbalance_volume_penalty_eur_per_kwh = 1000.0

[optimization]
virtual_arbitrage = false

[optimization.mpc]
da_horizon_hours = 48
id_horizon_hours = 48
fcr_price_horizon_hours = 48
fcr_frequency_horizon_minutes = 0
terminal_condition = true
terminal_weight_eur_per_kwh = 50.0

[optimization.flexibility]
bounds_file = "data/flexibility/market/VBbounds_f1_e572kWh_p150kW_eta98.csv"

[optimization.flexibility.cycle_regularization]
enabled = true
cost_eur_per_kwh_throughput = 0.02

[optimization.depot]
eta_grid2depot = 0.98
eta_depot2grid = 0.98
grid_connection_limit = 10000

[postprocessing]
save_commits = false

[postprocessing.reference_driving_energy_costs]
enabled = true
static_price_eur_per_kwh = 0.1142
energy_column = "Ref_driving_energy_kWh"
